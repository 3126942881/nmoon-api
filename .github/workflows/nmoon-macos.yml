name: 发布小月神api Mac

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nmoon-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the existing stable release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = '3126942881/nmoon-api'
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "v$version" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Stable Windows release required") else . end'
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
            jobs: '2'
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            jobs: '3'
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          key: nmoon-macos-${{ matrix.arch }}
          cache-on-failure: true
      - name: Install and verify dependencies
        run: |
          set -euo pipefail
          xcrun swift --version
          cmake --version
          npm ci
          npm run test:release
      - name: Build macOS installer and signed update archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run tauri -- build --ci --target '${{ matrix.target }}' --bundles app,dmg --config src-tauri/tauri.nmoon-macos.conf.json
      - name: Verify app, DMG, architecture and update signature
        run: python3 scripts/release/verify-nmoon-macos.py '${{ matrix.arch }}'
      - name: Stage verified files
        run: node scripts/release/nmoon-macos.cjs stage '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: NmoonAPI-macos-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: release-nmoon/macos-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: NmoonAPI-macos-*-${{ needs.prepare.outputs.version }}
          path: release-nmoon/macos-combined
          merge-multiple: true
      - name: Add Mac files and verify the combined updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/nmoon-macos.cjs publish release-nmoon/macos-combined
