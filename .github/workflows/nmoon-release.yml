name: 发布小月神api

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nmoon-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version and release destination
        id: version
        shell: pwsh
        run: |
          if ($env:GH_REPO -ne '3126942881/nmoon-api') { throw 'Unexpected repository' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected stable numeric version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          if (-not (Test-Path "docs/releases/v$version.md")) { throw 'Release notes missing' }
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect releases' }
          if ($releases | Where-Object { $_.tag_name -eq "v$version" -and -not $_.draft }) { throw 'Already published; increase the version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: nmoon-windows
          cache-on-failure: true
      - name: Install dependencies and verify
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build signed Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing secret missing' }
          npm run tauri -- build --ci --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:nmoon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NmoonAPI-windows-${{ steps.version.outputs.version }}
          path: release-nmoon/
          if-no-files-found: error
      - name: Publish complete release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $releases = gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect releases' }
          $existing = $releases | Where-Object { $_.tag_name -eq $tag }
          if ($existing -and -not $existing.draft) { throw 'Refusing to overwrite published release' }
          if (-not $existing) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "小月神api $tag" --notes-file "docs/releases/$tag.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $files = @(Get-ChildItem release-nmoon -File | Select-Object -ExpandProperty FullName)
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
          gh release edit $tag --draft=false --latest --notes-file "docs/releases/$tag.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
